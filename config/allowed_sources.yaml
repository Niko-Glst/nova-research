# Explicit allowlist of external sources this project may fetch from.
#
# Any module that touches Reddit, news, RSS, or (via the Playwright MCP server)
# a browser MUST read its permitted sources from this file rather than
# accepting/scraping arbitrary URLs. Add new sources here first, then use them.

subreddits:
  - wallstreetbets
  - investing
  - stocks

# Vetted financial publishers. An article is counted only if its URL or its
# publisher/source name matches one of these (see news_sources._matches_allowlist).
#
# Providers name their sources differently: yfinance reports "Yahoo Finance" and
# full URLs, while Finnhub reports bare names like "Yahoo", "CNBC" or
# "SeekingAlpha" with no domain. Both spellings are therefore listed, because a
# match is a plain substring test against "<url> <source>". Matching is
# case-insensitive.
news_domains:
  # Wire services and major papers
  - reuters.com
  - bloomberg.com
  - wsj.com
  - wall street journal
  - barrons.com
  - financial times
  # Aggregators and market media (domain + bare-name spellings)
  - finance.yahoo.com
  - yahoo
  - cnbc.com
  - cnbc
  - marketwatch.com
  - marketwatch
  - investors.com
  - investor's business daily
  - thestreet.com
  - thestreet
  - fool.com
  - motley fool
  - seekingalpha.com
  - seekingalpha
  - benzinga.com
  - benzinga
  - investing.com
  - zacks.com
  - zacks
  - businesswire.com
  - globenewswire.com
  - prnewswire.com

rss_feeds:
  - name: example_macro_feed
    url: https://example.com/rss/macro.xml  # placeholder — replace with a real, vetted feed

# Official FX reference rates for the correlation module's base-currency view
# (correlations/fred.py). Yahoo's FX history was rejected: its daily bars are
# dated correctly until about 2010 and one day late afterwards, which no single
# correction fixes. These are the Federal Reserve H.10 noon New York buying
# rates, served by FRED as plain CSV (no API key). Only the listed series may
# be fetched.
fred:
  url: https://fred.stlouisfed.org/graph/fredgraph.csv
  series:
    - DEXUSEU   # US dollars per euro
    - DEXSZUS   # Swiss francs per US dollar
    - DEXUSUK   # US dollars per pound sterling

# SEC EDGAR (added 2026-10-22, owner's request): XBRL company facts for
# point-in-time share counts and buyback/issuance cash flows of US filers. No
# key; SEC requires a descriptive User-Agent with a contact email
# (SEC_USER_AGENT in .env) and fewer than 10 requests per second. URLs and
# tags live in config/scoring.yaml under flows.sec.
sec:
  hosts:
    - www.sec.gov      # company_tickers.json (ticker -> CIK)
    - data.sec.gov     # api/xbrl/companyfacts

# Rate limiting defaults applied when fetching from the sources above.
# Individual modules may override these but must not remove them.
rate_limits:
  requests_per_minute: 30
  min_seconds_between_requests: 2

# Peer groups for fundamental comparison (fa_analyst.py).
#
# yfinance exposes no reliable peer/competitor endpoint, so niches are declared
# explicitly here. Keys are matched against a ticker's yfinance "industry"
# field (lowercased, non-alphanumerics collapsed to underscores); if a symbol's
# industry has no entry below, fa_analyst falls back to `default_peers_by_sector`
# and reports that the comparison is sector-level rather than niche-level.
peer_groups:
  consumer_electronics: [AAPL, SONY, HPQ, DELL, LOGI]
  software_infrastructure: [MSFT, ORCL, CRM, ADBE, NOW, VMW]
  # yfinance files Grindr and Duolingo under "Software - Application" alongside
  # enterprise vendors like Salesforce and Workday, which are not comparable:
  # a consumer subscription app and a B2B seat-licence business have different
  # margins, churn and growth profiles entirely. This group is therefore the
  # consumer set; enterprise names live under software_infrastructure.
  software_application: [MTCH, BMBL, DUOL, PINS, SNAP, YELP]
  semiconductors: [NVDA, AMD, INTC, AVGO, QCOM, TXN, MU]
  internet_content_information: [GOOGL, META, NFLX, PINS, SNAP]
  internet_retail: [AMZN, BABA, EBAY, ETSY, CHWY]
  auto_manufacturers: [TSLA, F, GM, RIVN, LCID, TM]
  banks_diversified: [JPM, BAC, WFC, C, HSBC]
  drug_manufacturers_general: [JNJ, PFE, MRK, ABBV, LLY, BMY]
  discount_stores: [WMT, COST, TGT, DG, DLTR]
  credit_services: [V, MA, AXP, PYPL, COF]
  aerospace_defense: [BA, LMT, RTX, NOC, GD]
  oil_gas_integrated: [XOM, CVX, SHEL, BP, TTE]
  # Rare-earth and specialty miners. MP's closest listed comparables are other
  # critical-minerals names rather than the diversified majors: they share the
  # same demand driver (EV/magnet supply chains) and the same pre-scale margins.
  other_industrial_metals_mining: [UEC, ALB, LAC, TMC, CRML, IPX]
  # Reddit's real comparables are ad-supported social platforms of a similar
  # scale, not the megacaps the broader industry key pulls in.
  social_media: [PINS, SNAP, BMBL, MTCH, YELP]
  # Ad-tech and agencies. yfinance files AppLovin and The Trade Desk here
  # alongside traditional agencies like Omnicom, so the group spans two quite
  # different businesses -- read the per-peer bars rather than the median alone.
  # (IPG was dropped: it no longer resolves after the Omnicom merger.)
  advertising_agencies: [TTD, OMC, MGNI, DV, IAS, CRTO]
  # Electrification and power-management names. yfinance splits this business
  # across two labels (Schneider, Siemens and Eaton are "Specialty Industrial
  # Machinery"; ABB, Legrand, Vertiv and Hubbell are "Electrical Equipment &
  # Parts"), so both keys point at the same set. The machinery label also covers
  # unrelated names such as pumps and compressors -- this group is curated for
  # the electrification players, and the sector fallback (CAT, BA, ...) would be
  # a worse comparison still. Mixed currencies are fine: every metric compared
  # is a ratio or a percentage.
  # Chip equipment. Listed closest first because max_peers truncates the list:
  # BESI, Kulicke & Soffa and ASMPT compete head to head in advanced packaging
  # (die attach, thermo-compression and hybrid bonding); ASM International,
  # ASML, Applied Materials and Lam are front-end tools with a different
  # cycle, kept as the broader reference.
  semiconductor_equipment_materials: [BESI.AS, KLIC, 0522.HK, ASM.AS, ASML.AS, AMAT, LRCX]
  # Early-commercial, loss-making oncology and immunotherapy, curated for
  # ImmunityBio (IBRX) and listed closest first: CG Oncology competes in the same
  # indication (BCG-unresponsive bladder cancer), UroGen sells bladder-cancer
  # drugs, then commercial cell and immuno-oncology launches (Iovance, Legend,
  # Geron, Autolus). yfinance files *every* biotech under this one label, so a
  # profitable or rare-disease biotech would be compared with the wrong set here:
  # give it its own group. Profitable mature names (Exelixis, Krystal) are left
  # out because their margins describe a different stage of life, not a better
  # version of this one.
  biotechnology: [CGON, URGN, IOVA, LEGN, GERN, AUTL]
  specialty_industrial_machinery: [SU.PA, SIE.DE, ABBN.SW, ETN, LR.PA, VRT, HUBB]
  electrical_equipment_parts: [SU.PA, SIE.DE, ABBN.SW, ETN, LR.PA, VRT, HUBB]

default_peers_by_sector:
  technology: [AAPL, MSFT, NVDA, GOOGL, AVGO]
  healthcare: [JNJ, LLY, UNH, MRK, ABBV]
  financial_services: [JPM, V, MA, BAC, WFC]
  consumer_cyclical: [AMZN, TSLA, HD, MCD, NKE]
  consumer_defensive: [WMT, COST, PG, KO, PEP]
  communication_services: [GOOGL, META, NFLX, DIS, T]
  energy: [XOM, CVX, COP, SLB, EOG]
  industrials: [CAT, BA, HON, UNP, GE]
  basic_materials: [LIN, SHW, FCX, NEM, ECL]
  utilities: [NEE, DUK, SO, D, AEP]
  real_estate: [PLD, AMT, EQIX, SPG, O]

# Maximum peers to fetch per comparison. Each peer costs one rate-limited
# request, so this caps how slow a single analysis can get.
max_peers: 6
