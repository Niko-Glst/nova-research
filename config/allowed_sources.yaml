# Explicit allowlist of external sources this project may fetch from.
#
# Any module that touches Reddit, news, RSS, or (via the Playwright MCP server)
# a browser MUST read its permitted sources from this file rather than
# accepting/scraping arbitrary URLs. Add new sources here first, then use them.

subreddits:
  - wallstreetbets
  - investing
  - stocks

# Vetted financial publishers. An article is counted only if its URL or its
# publisher/source name matches one of these (see news_sources._matches_allowlist).
#
# Providers name their sources differently: yfinance reports "Yahoo Finance" and
# full URLs, while Finnhub reports bare names like "Yahoo", "CNBC" or
# "SeekingAlpha" with no domain. Both spellings are therefore listed, because a
# match is a plain substring test against "<url> <source>". Matching is
# case-insensitive.
news_domains:
  # Wire services and major papers
  - reuters.com
  - bloomberg.com
  - wsj.com
  - wall street journal
  - barrons.com
  - financial times
  # Aggregators and market media (domain + bare-name spellings)
  - finance.yahoo.com
  - yahoo
  - cnbc.com
  - cnbc
  - marketwatch.com
  - marketwatch
  - investors.com
  - investor's business daily
  - thestreet.com
  - thestreet
  - fool.com
  - motley fool
  - seekingalpha.com
  - seekingalpha
  - benzinga.com
  - benzinga
  - investing.com
  - zacks.com
  - zacks
  - businesswire.com
  - globenewswire.com
  - prnewswire.com

rss_feeds:
  - name: example_macro_feed
    url: https://example.com/rss/macro.xml  # placeholder — replace with a real, vetted feed

# Rate limiting defaults applied when fetching from the sources above.
# Individual modules may override these but must not remove them.
rate_limits:
  requests_per_minute: 30
  min_seconds_between_requests: 2

# Peer groups for fundamental comparison (fa_analyst.py).
#
# yfinance exposes no reliable peer/competitor endpoint, so niches are declared
# explicitly here. Keys are matched against a ticker's yfinance "industry"
# field (lowercased, non-alphanumerics collapsed to underscores); if a symbol's
# industry has no entry below, fa_analyst falls back to `default_peers_by_sector`
# and reports that the comparison is sector-level rather than niche-level.
peer_groups:
  consumer_electronics: [AAPL, SONY, HPQ, DELL, LOGI]
  software_infrastructure: [MSFT, ORCL, CRM, ADBE, NOW, VMW]
  software_application: [CRM, NOW, INTU, ADSK, WDAY, TEAM]
  semiconductors: [NVDA, AMD, INTC, AVGO, QCOM, TXN, MU]
  internet_content_information: [GOOGL, META, NFLX, PINS, SNAP]
  internet_retail: [AMZN, BABA, EBAY, ETSY, CHWY]
  auto_manufacturers: [TSLA, F, GM, RIVN, LCID, TM]
  banks_diversified: [JPM, BAC, WFC, C, HSBC]
  drug_manufacturers_general: [JNJ, PFE, MRK, ABBV, LLY, BMY]
  discount_stores: [WMT, COST, TGT, DG, DLTR]
  credit_services: [V, MA, AXP, PYPL, COF]
  aerospace_defense: [BA, LMT, RTX, NOC, GD]
  oil_gas_integrated: [XOM, CVX, SHEL, BP, TTE]
  # Rare-earth and specialty miners. MP's closest listed comparables are other
  # critical-minerals names rather than the diversified majors: they share the
  # same demand driver (EV/magnet supply chains) and the same pre-scale margins.
  other_industrial_metals_mining: [UEC, ALB, LAC, TMC, CRML, IPX]
  # Reddit's real comparables are ad-supported social platforms of a similar
  # scale, not the megacaps the broader industry key pulls in.
  social_media: [PINS, SNAP, BMBL, MTCH, YELP]
  # Ad-tech and agencies. yfinance files AppLovin and The Trade Desk here
  # alongside traditional agencies like Omnicom, so the group spans two quite
  # different businesses -- read the per-peer bars rather than the median alone.
  # (IPG was dropped: it no longer resolves after the Omnicom merger.)
  advertising_agencies: [TTD, OMC, MGNI, DV, IAS, CRTO]

default_peers_by_sector:
  technology: [AAPL, MSFT, NVDA, GOOGL, AVGO]
  healthcare: [JNJ, LLY, UNH, MRK, ABBV]
  financial_services: [JPM, V, MA, BAC, WFC]
  consumer_cyclical: [AMZN, TSLA, HD, MCD, NKE]
  consumer_defensive: [WMT, COST, PG, KO, PEP]
  communication_services: [GOOGL, META, NFLX, DIS, T]
  energy: [XOM, CVX, COP, SLB, EOG]
  industrials: [CAT, BA, HON, UNP, GE]
  basic_materials: [LIN, SHW, FCX, NEM, ECL]
  utilities: [NEE, DUK, SO, D, AEP]
  real_estate: [PLD, AMT, EQIX, SPG, O]

# Maximum peers to fetch per comparison. Each peer costs one rate-limited
# request, so this caps how slow a single analysis can get.
max_peers: 6
