[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-research"
version = "0.1.0"
description = "Investment research pipeline (paper/simulation only, not financial advice)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "praw>=7.7",
]

[project.optional-dependencies]
# Optional: fast Kendall tau in correlations/ (built-in fallback without it) and
# independent reference checks in the tests. See docs/PROJECT_CONTEXT.md section 8.
stats = [
    "scipy>=1.11",
]
dev = [
    "pytest>=7.0",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
include = ["agents*", "backtests*", "config*", "common*", "correlations*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
